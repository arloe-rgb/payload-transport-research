payload:
  mass: 2.0
  inertia: 0.15
  gravity: 9.81
  width: 4
  height: 2

  # Attachment points in payload body frame [x, z]
  attachment_points:
    - [-2,  1]
    - [-1,  1]
    - [ 1,  1]
    - [ 2,  1]

controller:
  Kp: [1.0, 1.0, 1.0]
  Kd: [1.0, 1.0, 1.0]

SIM:
  initial_cond: [0, 0, 0, 0, 0, 0]
  dt: 0.1
  duration: 10
  N: 4 # number of UAVs