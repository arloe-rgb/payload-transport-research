payload:
  mass: 2.0
  inertia: 0.15
  gravity: 9.81
  width: 4
  height: 2

  # Attachment points in payload body frame [x, z]
  attachment_points:
    - [-2,  1]
    - [-1,  1]
    - [ 1,  1]
    - [ 2,  1]
  
  N: 4 # number of attachment points
  cable_lengths: [1.0, 1.0, 1.0, 1.0]

allocation:
  weights: [1.0, 1.0, 1.0, 1.0]
  F_max: [10.0, 10.0, 10.0, 10.0]
  min_cable_angle_deg: 30.0
  log_scalar: 0.01
  gamma: [10.0, 10.0, 10.0, 10.0,
          10.0, 10.0, 10.0, 10.0,
          5.0, 5.0, 5.0]

controller:
  Kp: [1.0, 1.0, 1.0]
  Kd: [1.0, 1.0, 1.0]

state_predictor:
  nominal_mass: 2.0
  nominal_inertia: 0.15
  k_s1: 5.0
  k_s2: 5.0

adaptation:
  w_init: [1.0, 1.0]
  projection_max_norm: 8.0
  projection_tol: 0.1
  gamma_w: [0.1, 0.1]
  error_position_gain: 1.0
  error_velocity_gain: 1.0

SIM:
  initial_cond: [0, 0, 0, 0, 0, 0]
  dt: 0.01
  duration: 15.0
  N: 4 # number of UAVs

reference_trajectory:
  type: "sinusoidal"

  duration: 15.0

  start: [0.0, 0.0, 0.0]
  goal: [3.0, 2.0, 0.0]

  circular:
    center: [0.0, 0.0]
    radius: 2.0
    omega: 0.5

  sinusoidal:
    amplitude: 1.0
    omega: 1.0
    vx: 0.5

  orientation:
    type: "sinusoidal"
    amplitude: 0.3
    omega: 3.141592653589793
    phase: 0.0