payload:
  mass: 2.0
  inertia: 0.15
  gravity: 9.81
  width: 4
  height: 2

  # Attachment points in payload body frame [x, z]
  attachment_points:
    - [-2,  1]
    - [-1,  1]
    - [ 1,  1]
    - [ 2,  1]

UAV:
  N: 4 # number of UAVs
  weights: [1.0, 1.0, 1.0, 1.0]
  F_max: [1.0, 1.0, 1.0, 1.0]
  log_scalar = 0.01

controller:
  Kp: [1.0, 1.0, 1.0]
  Kd: [1.0, 1.0, 1.0]

SIM:
  initial_cond: [0, 0, 0, 0, 0, 0]
  dt: 0.1
  duration: 10

reference_trajectory:
  type: "linear"

  duration: 5.0

  start: [0.0, 0.0, 0.0]
  goal: [3.0, 2.0, 0.0]

  circular:
    center: [0.0, 0.0]
    radius: 2.0
    omega: 0.5